# dsh-raganything-kb — same-origin reverse proxy for the RAG sidecar.
#
# Why this is required: the plugin's browser bundle resolves its sidecar URL as
# `${location.origin}/rag` whenever the DSH page is served over HTTPS, so that
# the request is same-origin instead of a mixed-content http://host:17321 call.
# Without this location the knowledge-base panel loads but stays "disconnected".
#
# The trailing slash on proxy_pass strips the /rag prefix before forwarding.
# Included automatically by install.sh into every TLS server block that proxies
# the DSH web port; adjust the port below if you changed --port.

location /rag/ {
    proxy_pass http://127.0.0.1:17321/;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 512m;
}
